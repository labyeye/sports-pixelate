name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm test
      - name: Dependency audit (high+)
        run: npm audit --omit=dev --audit-level=high

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint -- --quiet
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_API_URL: https://example.invalid/api

  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: NestSports } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: NestSports/package-lock.json }
      # react-native-print has an optional Windows peer that npm can't resolve.
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
